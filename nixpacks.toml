[phases.setup]
nixPkgs = ["nodejs-18_x", "python312"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps --prefix frontend",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "npm run build --prefix frontend"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --chdir backend"
