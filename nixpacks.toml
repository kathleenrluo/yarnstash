[phases.setup]
nixPkgs = ["nodejs-18_x", "python312"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd ../backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && VITE_DEMO_MODE=true npm run build"
]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
